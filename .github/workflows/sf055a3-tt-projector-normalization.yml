name: SF055A3 TT projector normalization

on:
  pull_request:
    paths:
      - 'research_log/SF055A3_TT_PROJECTOR_NORMALIZATION_FREEZE.md'
      - 'scripts/sf055a3_tt_projector_normalization.py'
      - '.github/workflows/sf055a3-tt-projector-normalization.yml'
  workflow_dispatch:

jobs:
  projector-normalization:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install numpy
        run: python -m pip install numpy
      - name: Run source TT projector normalization controls
        run: python scripts/sf055a3_tt_projector_normalization.py
      - name: Upload raw normalization
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sf055a3-tt-projector-normalization
          path: results/raw/SF055A3_TT_PROJECTOR_NORMALIZATION.json
          if-no-files-found: warn
