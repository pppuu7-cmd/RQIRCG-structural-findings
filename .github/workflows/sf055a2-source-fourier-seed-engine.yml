name: SF055A2 source-Fourier seed engine

on:
  pull_request:
    paths:
      - 'prereg/SF055A2_SOURCE_FOURIER_EH_GHOST_SEED_ENGINE_PREOUTCOME.md'
      - 'scripts/sf055a2_source_fourier_seed_engine.py'
      - '.github/workflows/sf055a2-source-fourier-seed-engine.yml'
  workflow_dispatch:

jobs:
  source-fourier-seed:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install numerical dependency
        run: python -m pip install --disable-pip-version-check numpy
      - name: Run prospectively frozen source-Fourier seed controls
        run: PYTHONPATH=scripts python scripts/sf055a2_source_fourier_seed_engine.py
      - name: Upload executed source-Fourier result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sf055a2-source-fourier-seed-engine
          path: results/raw/SF055A2_SOURCE_FOURIER_SEED_ENGINE.json
          if-no-files-found: error
