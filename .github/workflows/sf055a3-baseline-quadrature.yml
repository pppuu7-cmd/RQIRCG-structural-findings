name: SF055A3 frozen baseline quadrature

on:
  pull_request:
    paths:
      - 'scripts/sf055a3_baseline_quadrature.py'
      - 'scripts/sf055a3_baseline_aggregate.py'
      - 'scripts/sf055a3_numba_source.py'
      - 'research_log/SF055A3_BASELINE_QUADRATURE_IMPLEMENTATION_FREEZE.md'
      - '.github/workflows/sf055a3-baseline-quadrature.yml'
  workflow_dispatch:

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install numerical dependencies
        run: python -m pip install numpy numba
      - name: Exact implementation self-test
        run: python scripts/sf055a3_baseline_quadrature.py --mode selftest --out results/raw/SF055A3_BASELINE_QUADRATURE_SELFTEST.json
      - name: Upload self-test
        uses: actions/upload-artifact@v4
        with:
          name: sf055a3-baseline-selftest
          path: results/raw/SF055A3_BASELINE_QUADRATURE_SELFTEST.json

  three:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 18
      matrix:
        include:
          - {N: 8, p: '0.0', tag: p0}
          - {N: 12, p: '0.0', tag: p0}
          - {N: 16, p: '0.0', tag: p0}
          - {N: 24, p: '0.0', tag: p0}
          - {N: 8, p: '0.125', tag: p8}
          - {N: 12, p: '0.125', tag: p8}
          - {N: 16, p: '0.125', tag: p8}
          - {N: 24, p: '0.125', tag: p8}
          - {N: 8, p: '0.0625', tag: p16}
          - {N: 12, p: '0.0625', tag: p16}
          - {N: 16, p: '0.0625', tag: p16}
          - {N: 24, p: '0.0625', tag: p16}
          - {N: 8, p: '0.03125', tag: p32}
          - {N: 12, p: '0.03125', tag: p32}
          - {N: 16, p: '0.03125', tag: p32}
          - {N: 24, p: '0.03125', tag: p32}
          - {N: 16, p: '1.0', tag: p1}
          - {N: 24, p: '1.0', tag: p1}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install numerical dependencies
        run: python -m pip install numpy numba
      - name: Run three-point quadrature
        run: >-
          python scripts/sf055a3_baseline_quadrature.py
          --mode three --p ${{ matrix.p }} --N ${{ matrix.N }}
          --out results/raw/quadrature/three_${{ matrix.tag }}_N${{ matrix.N }}.json
      - name: Upload three-point quadrature
        uses: actions/upload-artifact@v4
        with:
          name: sf055a3-three-${{ matrix.tag }}-N${{ matrix.N }}
          path: results/raw/quadrature/three_${{ matrix.tag }}_N${{ matrix.N }}.json

  two:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        N: [8, 12, 16, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install numerical dependencies
        run: python -m pip install numpy numba
      - name: Run two-point beta-mu quadrature
        run: >-
          python scripts/sf055a3_baseline_quadrature.py
          --mode two --N ${{ matrix.N }}
          --out results/raw/quadrature/two_N${{ matrix.N }}.json
      - name: Upload two-point quadrature
        uses: actions/upload-artifact@v4
        with:
          name: sf055a3-two-N${{ matrix.N }}
          path: results/raw/quadrature/two_N${{ matrix.N }}.json

  aggregate:
    needs: [three, two]
    runs-on: ubuntu-latest
    if: always() && needs.three.result == 'success' && needs.two.result == 'success'
    steps:
      - uses: actions/checkout@v4
      - name: Download three-point artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: sf055a3-three-*
          path: results/collected
          merge-multiple: true
      - name: Download two-point artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: sf055a3-two-*
          path: results/collected
          merge-multiple: true
      - name: Aggregate frozen sequence and classify
        run: >-
          python scripts/sf055a3_baseline_aggregate.py
          --root results/collected
          --out results/raw/SF055A3_BASELINE_AGGREGATE.json
      - name: Upload aggregate even on scientific failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sf055a3-baseline-aggregate
          path: results/raw/SF055A3_BASELINE_AGGREGATE.json
