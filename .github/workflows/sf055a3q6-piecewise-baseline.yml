name: SF055A3Q6 radial-min2 piecewise baseline

on:
  push:
    paths:
      - 'scripts/sf055a3q6_piecewise_baseline.py'
      - 'scripts/sf055a3q6_source_jit_control.py'
      - 'scripts/sf055a3q6_piecewise_aggregate.py'
      - 'scripts/sf055a3q5_fixedq_control.py'
      - 'scripts/sf055a3q5_piecewise_baseline.py'
      - 'scripts/sf055a3_numba_source.py'
      - 'prereg/SF055A3Q6_RADIAL_MIN2_PIECEWISE_BASELINE_PREOUTCOME.md'
      - '.github/workflows/sf055a3q6-piecewise-baseline.yml'
  workflow_dispatch:

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install numpy numba
      - name: Q6 allocator and partition controls
        run: python scripts/sf055a3q6_piecewise_baseline.py --mode selftest --out results/raw/SF055A3Q6_SELFTEST.json
      - name: Source/JIT equivalence
        run: python scripts/sf055a3q6_source_jit_control.py
      - name: Fixed-q topology equivalence
        run: python scripts/sf055a3q5_fixedq_control.py
      - name: Upload preflight
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sf055a3q6-preflight
          path: |
            results/raw/SF055A3Q6_SELFTEST.json
            results/raw/SF055A3Q6_SOURCE_JIT_CONTROL.json
            results/raw/SF055A3Q5_FIXEDQ_CONTROL.json

  three:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 18
      matrix:
        include:
          - {N: 8, p: '0.0', tag: p0}
          - {N: 12, p: '0.0', tag: p0}
          - {N: 16, p: '0.0', tag: p0}
          - {N: 24, p: '0.0', tag: p0}
          - {N: 8, p: '0.125', tag: p8}
          - {N: 12, p: '0.125', tag: p8}
          - {N: 16, p: '0.125', tag: p8}
          - {N: 24, p: '0.125', tag: p8}
          - {N: 8, p: '0.0625', tag: p16}
          - {N: 12, p: '0.0625', tag: p16}
          - {N: 16, p: '0.0625', tag: p16}
          - {N: 24, p: '0.0625', tag: p16}
          - {N: 8, p: '0.03125', tag: p32}
          - {N: 12, p: '0.03125', tag: p32}
          - {N: 16, p: '0.03125', tag: p32}
          - {N: 24, p: '0.03125', tag: p32}
          - {N: 16, p: '1.0', tag: p1}
          - {N: 24, p: '1.0', tag: p1}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy numba
      - name: Run Q6 three-point quadrature
        run: >-
          python scripts/sf055a3q6_piecewise_baseline.py
          --mode three --p ${{ matrix.p }} --N ${{ matrix.N }}
          --out results/raw/q6/three_${{ matrix.tag }}_N${{ matrix.N }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: sf055a3q6-three-${{ matrix.tag }}-N${{ matrix.N }}
          path: results/raw/q6/three_${{ matrix.tag }}_N${{ matrix.N }}.json

  two:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        N: [8, 12, 16, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy numba
      - name: Run Q6 two-point control
        run: >-
          python scripts/sf055a3q6_piecewise_baseline.py
          --mode two --N ${{ matrix.N }}
          --out results/raw/q6/two_N${{ matrix.N }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: sf055a3q6-two-N${{ matrix.N }}
          path: results/raw/q6/two_N${{ matrix.N }}.json

  aggregate:
    needs: [three, two]
    runs-on: ubuntu-latest
    if: always() && needs.three.result == 'success' && needs.two.result == 'success'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: sf055a3q6-*
          path: results/collected
          merge-multiple: true
      - name: Aggregate under historical criteria
        id: aggregate
        continue-on-error: true
        run: >-
          python scripts/sf055a3q6_piecewise_aggregate.py
          --root results/collected
          --historical results/raw/SF055A3_BASELINE_AGGREGATE_RUN35019599951.json
          --out results/raw/SF055A3Q6_PIECEWISE_BASELINE_AGGREGATE.json
      - name: Upload aggregate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sf055a3q6-aggregate
          path: results/raw/SF055A3Q6_PIECEWISE_BASELINE_AGGREGATE.json
      - if: steps.aggregate.outcome == 'failure'
        run: echo 'Terminal non-PASS classification uploaded; not an infrastructure failure.'
