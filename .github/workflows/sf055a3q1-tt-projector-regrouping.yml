name: SF055A3Q1 TT projector regrouping

on:
  push:
    branches: [main]
    paths:
      - 'prereg/SF055A3Q1_TT_PROJECTOR_RANK1_ACCELERATION_PREOUTCOME.md'
      - 'scripts/sf055a3q1_tt_projector_regrouping.py'
      - '.github/workflows/sf055a3q1-tt-projector-regrouping.yml'
  workflow_dispatch:

jobs:
  regrouping:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install numpy
        run: python -m pip install numpy
      - name: Run exact TT projector regrouping controls
        run: python scripts/sf055a3q1_tt_projector_regrouping.py
      - name: Upload raw result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sf055a3q1-tt-projector-regrouping
          path: results/raw/SF055A3Q1_TT_PROJECTOR_REGROUPING.json
          if-no-files-found: warn
